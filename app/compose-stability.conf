// ─── Compose 稳定性声明 ────────────────────────────────────────────────
//
// Compose 把 `kotlin.collections.List` / `Map` 判为不稳定，于是内含它们的类**全被判 unstable**
// —— 本项目 domain 模型都是 `data class` + `val`，一个可变字段都没有。
//
// ⚠️ 强跳过模式（Kotlin 2.0.20+ 默认开启，本项目 2.2.10）下 unstable 参数按**引用** `===` 比较：
// 列表重新解析出一批内容相同的新 `Vod` 实例，跳过检查照样失败。声明成 stable 后改按 `equals()`
// 比较，结构相同即跳过。
// （不是「否则 lambda 无法被记住」—— 强跳过本来就会把捕获 lambda 包进 remember；别照抄网上那套说法。）
//
// 不给模型加 `@Immutable`：那让 domain 依赖 Compose，破坏 `ui → domain ← data`。
// ⚠️ 只声明**真的不可变**的类 —— 含 `var` / `MutableStateFlow` 的类进来会变成「状态变了界面不动」。
com.cycling.beevideo.domain.model.*
