[versions]
agp = "9.3.2"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.06.01"
# M3 Expressive 的 API（MaterialExpressiveTheme / MotionScheme / MaterialShapes /
# LoadingIndicator / TopAppBar.subtitle）在 1.4.0 稳定版中全部为 internal 或不存在。
# 要使用 Expressive 必须显式指定 1.5.0-alpha，覆盖 BOM 的版本管理。
material3 = "1.5.0-alpha28"
media3 = "1.11.1"
navigationCompose = "2.10.1"
lifecycleViewmodelCompose = "2.11.0"
coil = "2.7.0"
# OkHttp 是 CatVod 兼容层（com.github.catvod.net.OkHttp）要用到的。
# 虽然 Coil 会传递带一个 okhttp3，但那是它的私有依赖，版本随时可能被它抬走 ——
# 而 jar 里的 spider 会直接调我们这层，签名/版本必须是本项目说了算，所以显式钉死。
okhttp = "4.12.0"
# 单元测试里的 org.json。Android 的 android.jar 只提供**桩**实现（调用即抛
# "Stub!"），所以纯 JVM 测试里必须换成真实实现，否则 CatVodConfigParser
# 一 `JSONObject(json)` 就炸。仅 testImplementation，不进 APK。
orgJson = "20240303"
# Gson。**不是我们想用，是真实 csp jar 一定要**：反汇编 7 个真实 jar 的 DEX
# 后发现 com/google/gson 是 7/7 全部依赖、且没有一个把 Gson 打进 jar 里 ——
# 也就是说这一层必须由宿主提供，缺了就是 NoClassDefFoundError。
# 另外 SpiderApi.multiReq 的签名里直接有 com.google.gson.JsonArray。
gson = "2.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ViewModel
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }

# Media3 / ExoPlayer
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# Image loading
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# 网络（CatVod 兼容层 + 站点请求）
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# 仅单元测试用（真实 org.json，替代 android.jar 的桩）
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

# Gson —— 真实 csp jar 的硬依赖，见上面 gson 版本号的注释
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

