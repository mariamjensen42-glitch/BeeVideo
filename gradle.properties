# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# ── KSP × AGP 9 内置 Kotlin ────────────────────────────────────────────────
# AGP 9 起 Kotlin 由插件内置，而内置 Kotlin 默认**拒绝** `kotlin.sourceSets` DSL ——
# KSP 恰恰用它来登记 `build/generated/ksp/**`，于是配置阶段直接失败：
#   Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with built-in Kotlin.
#   … To suppress this error, set android.disallowKotlinSourceSets=false in gradle.properties.
# 这一行就是错误信息自己给出的开关（KSP issue #2729 确认可用）。
#
# ⚠️ 没走"干净解法"（升 KSP 到 2.3.6+）的原因：KSP 版本号绑 Kotlin，而**内置 Kotlin 的
#    版本由 AGP 决定**（本项目 AGP 9.3.2 内置 2.2.10），不是改 libs.versions.toml 里那个
#    `kotlin` 就能换的。想升 KSP 就得先升 AGP，不该混在"补核心功能"里做。
#
# ⚠️ 它只保证**配置阶段能过**，不保证生成的代码真的被编译进 APK。验收判据必须是
#    「dex 里能找到 <Database>_Impl」+「真机上数据库能打开」，别只看 BUILD SUCCESSFUL。
android.disallowKotlinSourceSets=false